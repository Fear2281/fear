name: Encore checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore
      - run: python3 scripts/smoke.py
